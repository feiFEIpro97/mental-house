      <div class="sidebar">
        <div class="sidebar-logo">
          {{ t('logoTitle') }}
          <div class="sub">{{ t('logoSub') }}</div>
        </div>
        <div class="sidebar-menu">
          <div v-for="item in menuItems" :key="item.path">
            <div 
              class="menu-item" 
              :class="{ active: currentPath === item.path || (item.children && item.children.some(c => c.path === currentPath)) }"
              @click="item.children ? toggleMenu(item) : navigate(item.path)"
            >
              <span>{{ item.icon }}</span>
              <span>{{ t(item.name) }}</span>
              <span v-if="item.children" class="arrow" :class="{ open: item.open }">▶</span>
            </div>
            <div v-if="item.children && item.open" class="sub-menu">
              <div 
                v-for="sub in item.children" 
                :key="sub.path"
                class="menu-item"
                :class="{ active: currentPath === sub.path }"
                @click="navigate(sub.path)"
              >
                {{ t(sub.name) }}
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Main Container -->
      <div class="main-container">
        <!-- Topbar -->

        <!-- Content -->

        </div>

              <div style="flex: 1; background: #fff7e6; padding: 15px; border-radius: 8px; text-align: center;">
                <div style="font-weight: bold; margin-bottom: 5px;">{{ t('layerService') }}</div>
                <div style="font-size: 12px; color: #606266;" v-html="t('layerServiceDesc')"></div>
              </div>
            </div>
            <h4 style="margin-bottom: 10px;">{{ t('hHardware') }}</h4>
            <div style="background: #f5f7fa; padding: 15px; border-radius: 8px; font-size: 13px; color: #606266; line-height: 2;">
              <p>{{ t('aboutHw1') }}</p>
              <p>{{ t('aboutHw2') }}</p>
              <p>{{ t('aboutHw3') }}</p>
              <p>{{ t('aboutHw4') }}</p>
              <p>{{ t('aboutHw5') }}</p>
              <p>{{ t('aboutHw6') }}</p>
            </div>
          </div>
        </div>
      `
    };

    // Page 15: History
    const HistoryPage = {
      template: `
        <div>
          <h2 class="page-title">{{ t('pgHistory') }}</h2>
          <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <el-input v-model="searchQuery" :placeholder="t('searchHistoryPh')" style="width: 300px;" prefix-icon="Search"></el-input>
            <el-button @click="clearAllHistory" type="danger" text>{{ t('btnClearAll') }}</el-button>
          </div>
          <div v-if="historyList.length === 0" style="text-align: center; padding: 60px; color: #909399;">
            <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
            <p>{{ t('emptyTitle') }}</p>
            <p style="font-size: 13px; margin-top: 10px;">{{ t('emptySub') }}</p>
          </div>
          <div v-else class="card-grid">
            <div v-for="session in filteredHistory" :key="session.id" class="history-card" @click="continueSession(session)">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 20px;">{{ session.agentIcon }}</span>
                  <span style="font-weight: bold; font-size: 14px;">{{ t(session.agentName) }}</span>
                </div>
                <el-tag size="small" :type="session.model === 'deepseek' ? 'primary' : 'success'">{{ session.model === 'deepseek' ? 'DeepSeek-R1' : 'Qwen3.6' }}</el-tag>
              </div>
              <div style="color: #606266; font-size: 13px; margin-bottom: 10px; line-height: 1.5; min-height: 40px;">
                <b>{{ t('lblQuestion') }}</b>{{ session.firstQuestion }}
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; color: #909399; font-size: 12px;">
                <span>{{ session.timestamp }}</span>
                <span>{{ session.messages.length }}{{ t('unitMsgs') }}</span>
              </div>
              <div style="margin-top: 10px; display: flex; gap: 8px;">
                <el-tag size="small" :type="session.disambiguation ? 'success' : 'info'">{{ session.disambiguation ? t('disambOn') : t('disambOff') }}</el-tag>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const searchQuery = ref('');
        const historyList = ref([]);

        const loadHistory = () => {
          const stored = localStorage.getItem('ai_chat_history');
          if (stored) {
            historyList.value = JSON.parse(stored);
          }
        };

        const filteredHistory = computed(() => {
          if (!searchQuery.value) return historyList.value;
          const query = searchQuery.value.toLowerCase();
          return historyList.value.filter(h =>
            h.agentName.toLowerCase().includes(query) ||
            h.firstQuestion.toLowerCase().includes(query)
          );
        });

        const clearAllHistory = () => {
          ElMessageBox.confirm(t('confirmClear'), t('dlgTip'), {
            confirmButtonText: t('btnConfirm'),
            cancelButtonText: t('btnCancel'),
            type: 'warning'
          }).then(() => {
            localStorage.removeItem('ai_chat_history');
            historyList.value = [];
            ElMessage.success(t('msgHistoryCleared'));
          }).catch(() => {});
        };

        const continueSession = (session) => {
          // 将当前会话数据存储到sessionStorage，以便首页加载
          sessionStorage.setItem('current_session', JSON.stringify(session));
          router.push('/');
          ElMessage.success(t('msgHistoryLoaded'));
        };

        onMounted(() => {
          loadHistory();
        });

        return { searchQuery, historyList, filteredHistory, clearAllHistory, continueSession };
      }
    };

    // ============ Router ============
    const routes = [
      { path: '/', component: HomePage },
      { path: '/history', component: HistoryPage },
      { path: '/agents', component: AgentPage },
      { path: '/knowledge', component: KnowledgePage },
      { path: '/template', component: TemplatePage },
      { path: '/graph', component: GraphPage },
      { path: '/tools', component: ToolPage },
      { path: '/config', component: ConfigPage },
      { path: '/logs', component: LogPage },
      { path: '/ontology-overview', component: OntologyOverviewPage },
      { path: '/ontology-manage', component: OntologyManagePage },
      { path: '/question-input', component: QuestionInputPage },
      { path: '/model', component: ModelPage },
      { path: '/security', component: SecurityPage },
      { path: '/about', component: AboutPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // ============ App ============
    const app = createApp({
      setup() {
        const currentPath = ref('/');
        const menuItems = ref([
          { name: 'menuChat', icon: '💬', path: '/', open: false, children: [
            { name: 'menuNewChat', path: '/' },
            { name: 'menuHistory', path: '/history' }
          ]},
          { name: 'menuAgents', icon: '🤖', path: '/agents' },
          { name: 'menuKb', icon: '📚', path: '/knowledge', open: false, children: [
            { name: 'menuKbManage', path: '/knowledge' },
            { name: 'menuTpl', path: '/template' }
          ]},
          { name: 'menuGraph', icon: '🕸️', path: '/graph' },
          { name: 'menuDisamb', icon: '🔧', path: '/tools', open: false, children: [
            { name: 'menuTools', path: '/tools' },
            { name: 'menuConfig', path: '/config' },
            { name: 'menuLogs', path: '/logs' }
          ]},
          { name: 'menuOntology', icon: '📖', path: '/ontology-overview', open: false, children: [
            { name: 'menuOntOverview', path: '/ontology-overview' },
            { name: 'menuOntManage', path: '/ontology-manage' },
            { name: 'menuQInput', path: '/question-input' }
          ]},
          { name: 'menuSys', icon: '⚙️', path: '/model', open: false, children: [
            { name: 'menuModel', path: '/model' },
            { name: 'menuSecurity', path: '/security' }
          ]},
          { name: 'menuAbout', icon: 'ℹ️', path: '/about' }
        ]);

        const breadcrumb = computed(() => {
          const map = {
            '/': 'bcHome',
            '/history': 'bcHistory',
            '/agents': 'bcAgents',
            '/knowledge': 'bcKb',
            '/template': 'bcTpl',
            '/graph': 'bcGraph',
            '/tools': 'bcTools',
            '/config': 'bcConfig',
            '/logs': 'bcLogs',
            '/ontology-overview': 'bcOntOverview',
            '/ontology-manage': 'bcOntManage',
            '/question-input': 'bcQInput',
            '/model': 'bcModel',
            '/security': 'bcSecurity',
            '/about': 'bcAbout'
          };
          return t(map[currentPath.value] || 'bcHomeFallback');
        });

        const navigate = (path) => {
          currentPath.value = path;
          router.push(path);
        };

        const toggleMenu = (item) => {
          item.open = !item.open;
        };

        router.afterEach((to) => {
          currentPath.value = to.path;
        });

        return { currentPath, menuItems, breadcrumb, navigate, toggleMenu };
      }
    });

    app.config.globalProperties.t = t;
    app.use(router);
    app.use(ElementPlus);
    app.mount('#app');
    applyLang();
  </script>
</body>
</html>
