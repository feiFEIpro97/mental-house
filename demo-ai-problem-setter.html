        <div class="sidebar-menu">
          <div v-for="item in menuItems" :key="item.path">
            <div 
              class="menu-item" 
              :class="{ active: currentPath === item.path || (item.children && item.children.some(c => c.path === currentPath)) }"
              @click="item.children ? toggleMenu(item) : navigate(item.path)"
            >
              <span>{{ item.icon }}</span>
              <span>{{ item.name }}</span>
              <span v-if="item.children" class="arrow" :class="{ open: item.open }">▶</span>
            </div>
            <div v-if="item.children && item.open" class="sub-menu">
              <div 
                v-for="sub in item.children" 
                :key="sub.path"
                class="menu-item"
                :class="{ active: currentPath === sub.path }"
                @click="navigate(sub.path)"
              >
                {{ sub.name }}
              </div>
            </div>
          </div>
        </div>
      </div>

              <h3 style="margin-bottom: 15px;">私有化算力配置</h3>
              <div style="font-size: 13px; color: #606266; line-height: 2;">
                <p><b>服务器：</b>Atlas 800T A2</p>
                <p><b>CPU：</b>4×鲲鹏920 48核</p>
                <p><b>NPU：</b>8×昇腾910B</p>
                <p><b>内存：</b>32×64GB</p>
                <p><b>显存：</b>8×64GB</p>
              </div>
            </div>
          </div>
          <div class="stat-card">
            <h3 style="margin-bottom: 15px;">并发配置</h3>
            <div style="display: flex; align-items: center; gap: 20px;">
              <span>最大并发人数：</span>
              <el-slider v-model="maxConcurrent" :max="200" :step="10" style="width: 300px;"></el-slider>
              <span style="font-weight: bold; color: #1677ff;">{{ maxConcurrent }}人</span>
            </div>
          </div>
        </div>
      `,
      setup() {
        const currentModel = ref('deepseek');
        const maxConcurrent = ref(100);
        const switchModel = () => {
          ElMessage.success('模型切换中...');
        };
        return { currentModel, maxConcurrent, switchModel };
      }
    };

    // Page 13: Security Audit
    const SecurityPage = {
      template: `
        <div>
          <h2 class="page-title">权限与安全审计</h2>
          <el-tabs v-model="activeTab">
            <el-tab-pane label="角色权限" name="role">
              <div class="stat-card" style="margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px;">角色分级权限</h3>
                <el-table :data="roles" style="width: 100%">
                  <el-table-column prop="name" label="角色名称"></el-table-column>
                  <el-table-column prop="permissions" label="权限范围"></el-table-column>
                  <el-table-column prop="dataScope" label="数据隔离"></el-table-column>
                </el-table>
              </div>
            </el-tab-pane>
            <el-tab-pane label="安全配置" name="security">
              <div class="stat-card" style="margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px;">安全配置</h3>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>国密存储加密</span>
                    <el-switch v-model="encryptionOn" active-text="开启"></el-switch>
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>内网物理隔离</span>
                    <el-tag type="success">已启用</el-tag>
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>WORM不可篡改日志</span>
                    <el-switch v-model="wormOn" active-text="开启"></el-switch>
                  </div>
                </div>
              </div>
            </el-tab-pane>
            <el-tab-pane label="审计日志" name="audit">
              <div class="stat-card">
                <h3 style="margin-bottom: 15px;">审计日志</h3>
                <el-table :data="auditLogs" style="width: 100%">
                  <el-table-column prop="user" label="操作人" width="120"></el-table-column>
                  <el-table-column prop="action" label="操作类型" width="150"></el-table-column>
                  <el-table-column prop="time" label="时间" width="180"></el-table-column>
                  <el-table-column prop="ip" label="IP地址" width="150"></el-table-column>
                  <el-table-column prop="detail" label="详情"></el-table-column>
                </el-table>
              </div>
            </el-tab-pane>
          </el-tabs>
        </div>
      `,
      setup() {
        const activeTab = ref('role');
        const encryptionOn = ref(true);
        const wormOn = ref(true);
        const roles = ref([
          { name: '管理员', permissions: '全部权限', dataScope: '全部科目' },
          { name: '命题组长', permissions: '试题管理、审核', dataScope: '指定科目' },
          { name: '单科命题员', permissions: '命题、查看', dataScope: '仅所属科目' }
        ]);
        return { activeTab, encryptionOn, wormOn, roles, auditLogs: mockAuditLogs };
      }
    };

    // Page 14: About
    const AboutPage = {
      template: `
        <div>
          <h2 class="page-title">关于</h2>
          <div class="stat-card" style="margin-bottom: 20px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;">某省招生考试院命题智能体平台</h3>
            <p style="color: #606266; line-height: 2; margin-bottom: 20px;">
              构建面向中考、高考等高利害考试的命题智能体平台，依托专属技术底座，贯穿出题-解题-质检全环节，
              解决传统命题高度依赖专家经验、人工校对工作量大、效率与质量难以兼顾的痛点。
            </p>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
              <div style="text-align: center; padding: 20px; background: #f5f7fa; border-radius: 8px;">
                <div style="font-size: 32px; font-weight: bold; color: #1677ff;">7</div>
                <div style="color: #909399; margin-top: 5px;">专属智能体</div>
              </div>
              <div style="text-align: center; padding: 20px; background: #f5f7fa; border-radius: 8px;">
                <div style="font-size: 32px; font-weight: bold; color: #52c41a;">4</div>
                <div style="color: #909399; margin-top: 5px;">AI技术底座</div>
              </div>
              <div style="text-align: center; padding: 20px; background: #f5f7fa; border-radius: 8px;">
                <div style="font-size: 32px; font-weight: bold; color: #faad14;">30%</div>
                <div style="color: #909399; margin-top: 5px;">准确率提升</div>
              </div>
            </div>
            <h4 style="margin-bottom: 10px;">三层架构</h4>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
              <div style="flex: 1; background: #e6f7ff; padding: 15px; border-radius: 8px; text-align: center;">
                <div style="font-weight: bold; margin-bottom: 5px;">基础设施层</div>
                <div style="font-size: 12px; color: #606266;">鲲鹏NPU算力<br>国产大模型</div>
              </div>
              <div style="flex: 1; background: #f6ffed; padding: 15px; border-radius: 8px; text-align: center;">
                <div style="font-weight: bold; margin-bottom: 5px;">平台层</div>
                <div style="font-size: 12px; color: #606266;">知识库/图谱<br>歧义消除/本体</div>
              </div>
              <div style="flex: 1; background: #fff7e6; padding: 15px; border-radius: 8px; text-align: center;">
                <div style="font-weight: bold; margin-bottom: 5px;">服务层</div>
                <div style="font-size: 12px; color: #606266;">智能体矩阵<br>门户工作台</div>
              </div>
            </div>
            <h4 style="margin-bottom: 10px;">硬件部署方案</h4>
            <div style="background: #f5f7fa; padding: 15px; border-radius: 8px; font-size: 13px; color: #606266; line-height: 2;">
              <p><b>服务器：</b>Atlas 800T A2 × 2台</p>
              <p><b>CPU：</b>4×鲲鹏920 48核</p>
              <p><b>NPU：</b>8×昇腾910B (376T, 64G)</p>
              <p><b>内存：</b>32×64GB</p>
              <p><b>存储：</b>2×3.84T NVME</p>
              <p><b>并发：</b>支持100人同时在线</p>
            </div>
          </div>
        </div>
      `
    };

    // Page 15: History
    const HistoryPage = {
      template: `
        <div>
          <h2 class="page-title">历史问答</h2>
          <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <el-input v-model="searchQuery" placeholder="搜索历史问答" style="width: 300px;" prefix-icon="Search"></el-input>
            <el-button @click="clearAllHistory" type="danger" text>清空全部历史</el-button>
          </div>
          <div v-if="historyList.length === 0" style="text-align: center; padding: 60px; color: #909399;">
            <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
            <p>暂无历史问答记录</p>
            <p style="font-size: 13px; margin-top: 10px;">在「新建问答」页面开始您的第一次对话</p>
          </div>
          <div v-else class="card-grid">
            <div v-for="session in filteredHistory" :key="session.id" class="history-card" @click="continueSession(session)">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 20px;">{{ session.agentIcon }}</span>
                  <span style="font-weight: bold; font-size: 14px;">{{ session.agentName }}</span>
                </div>
                <el-tag size="small" :type="session.model === 'deepseek' ? 'primary' : 'success'">{{ session.model === 'deepseek' ? 'DeepSeek-R1' : 'Qwen3.6' }}</el-tag>
              </div>
              <div style="color: #606266; font-size: 13px; margin-bottom: 10px; line-height: 1.5; min-height: 40px;">
                <b>问题：</b>{{ session.firstQuestion }}
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; color: #909399; font-size: 12px;">
                <span>{{ session.timestamp }}</span>
                <span>{{ session.messages.length }}条对话</span>
              </div>
              <div style="margin-top: 10px; display: flex; gap: 8px;">
                <el-tag size="small" :type="session.disambiguation ? 'success' : 'info'">{{ session.disambiguation ? '歧义消除开启' : '歧义消除关闭' }}</el-tag>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const searchQuery = ref('');
        const historyList = ref([]);

        const loadHistory = () => {
          const stored = localStorage.getItem('ai_chat_history');
          if (stored) {
            historyList.value = JSON.parse(stored);
          }
        };

        const filteredHistory = computed(() => {
          if (!searchQuery.value) return historyList.value;
          const query = searchQuery.value.toLowerCase();
          return historyList.value.filter(h =>
            h.agentName.toLowerCase().includes(query) ||
            h.firstQuestion.toLowerCase().includes(query)
          );
        });

        const clearAllHistory = () => {
          ElMessageBox.confirm('确定要清空所有历史问答记录吗？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            localStorage.removeItem('ai_chat_history');
            historyList.value = [];
            ElMessage.success('历史记录已清空');
          }).catch(() => {});
        };

        const continueSession = (session) => {
          // 将当前会话数据存储到sessionStorage，以便首页加载
          sessionStorage.setItem('current_session', JSON.stringify(session));
          router.push('/');
          ElMessage.success('已加载历史会话，可以继续提问');
        };

        onMounted(() => {
          loadHistory();
        });

        return { searchQuery, historyList, filteredHistory, clearAllHistory, continueSession };
      }
    };

    // ============ Router ============
    const routes = [
      { path: '/', component: HomePage },
      { path: '/history', component: HistoryPage },
      { path: '/agents', component: AgentPage },
      { path: '/knowledge', component: KnowledgePage },
      { path: '/template', component: TemplatePage },
      { path: '/graph', component: GraphPage },
      { path: '/tools', component: ToolPage },
      { path: '/config', component: ConfigPage },
      { path: '/logs', component: LogPage },
      { path: '/ontology-overview', component: OntologyOverviewPage },
      { path: '/ontology-manage', component: OntologyManagePage },
      { path: '/question-input', component: QuestionInputPage },
      { path: '/model', component: ModelPage },
      { path: '/security', component: SecurityPage },
      { path: '/about', component: AboutPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // ============ App ============
    const app = createApp({
      setup() {
        const currentPath = ref('/');
        const menuItems = ref([
          { name: 'AI智能问答', icon: '💬', path: '/', open: false, children: [
            { name: '新建问答', path: '/' },
            { name: '历史问答', path: '/history' }
          ]},
          { name: '智能体管理', icon: '🤖', path: '/agents' },
          { name: '知识库', icon: '📚', path: '/knowledge', open: false, children: [
            { name: '知识库管理', path: '/knowledge' },
            { name: '向量化模板', path: '/template' }
          ]},
          { name: '知识图谱', icon: '🕸️', path: '/graph' },
          { name: '歧义消除', icon: '🔧', path: '/tools', open: false, children: [
            { name: '学科工具', path: '/tools' },
            { name: '歧义消除配置', path: '/config' },
            { name: '歧义消除日志', path: '/logs' }
          ]},
          { name: '领域本体', icon: '📖', path: '/ontology-overview', open: false, children: [
            { name: '总览', path: '/ontology-overview' },
            { name: '领域本体管理', path: '/ontology-manage' },
            { name: '试题录入', path: '/question-input' }
          ]},
          { name: '系统设置', icon: '⚙️', path: '/model', open: false, children: [
            { name: '模型管理', path: '/model' },
            { name: '权限与安全审计', path: '/security' }
          ]},
          { name: '关于', icon: 'ℹ️', path: '/about' }
        ]);

        const breadcrumb = computed(() => {
          const map = {
            '/': 'AI智能问答 - 新建问答',
            '/history': 'AI智能问答 - 历史问答',
            '/agents': '智能体管理',
            '/knowledge': '知识库管理',
            '/template': '向量化模板',
            '/graph': '知识图谱',
            '/tools': '学科工具',
            '/config': '歧义消除配置',
            '/logs': '歧义消除日志',
            '/ontology-overview': '领域本体总览',
            '/ontology-manage': '领域本体管理',
            '/question-input': '试题录入',
            '/model': '模型管理',
            '/security': '权限与安全审计',
            '/about': '关于'
          };
          return map[currentPath.value] || '首页';
        });

        const navigate = (path) => {
          currentPath.value = path;
          router.push(path);
        };

        const toggleMenu = (item) => {
          item.open = !item.open;
        };

        router.afterEach((to) => {
          currentPath.value = to.path;
        });

        return { currentPath, menuItems, breadcrumb, navigate, toggleMenu };
      }
    });

    app.use(router);
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
