*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a3c6e;--blue2:#2d5a9e;--bg:#f0f2f5;--green:#4caf50;--orange:#ff9800;--red:#f44336;--grey:#90a4ae}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#333;font-size:14px}
a{text-decoration:none;color:inherit}
.sidebar{width:200px;background:var(--blue);color:#fff;height:100vh;position:fixed;left:0;top:0;overflow-y:auto}
.sidebar .logo{padding:20px 16px;font-size:15px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.15);text-align:center;line-height:1.4}

.topbar .page-title{font-size:16px;font-weight:600;color:var(--blue)}
.role-switch{display:flex;gap:0;border:1px solid var(--blue);border-radius:4px;overflow:hidden}
.role-switch button{padding:6px 14px;border:none;background:#fff;color:var(--blue);cursor:pointer;font-size:13px;transition:all .2s}
.role-switch button.active{background:var(--blue);color:#fff}
.content{padding:20px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.stat-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:200px;background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px}
.stat-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.stat-info .num{font-size:24px;font-weight:700;color:#333}
.stat-info .label{font-size:13px;color:#999;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--blue);color:#fff;padding:10px 12px;text-align:left;font-weight:500;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eee}
tr:nth-child(even){background:#f9f9f9}
tr:hover{background:#e3f2fd}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.badge-green{background:#e8f5e9;color:var(--green)}.badge-orange{background:#fff3e0;color:var(--orange)}
.badge-red{background:#ffebee;color:var(--red)}.badge-grey{background:#eceff1;color:var(--grey)}
.badge-blue{background:#e3f2fd;color:var(--blue)}
.sub-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--blue);flex-wrap:wrap}
.sub-tab{padding:8px 20px;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.sub-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.sub-page{display:none}.sub-page.active{display:block}
.bar-chart{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:120px;font-size:13px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:600}
.pie{width:120px;height:120px;border-radius:50%;position:relative;margin:0 auto}
.pie-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.pie-legend .dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px}
.form-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.form-label{width:100px;text-align:right;font-size:13px;color:#666;flex-shrink:0;padding-top:8px}
.form-input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.form-select{padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px;background:#fff}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-success{background:var(--green);color:#fff}.btn-warn{background:var(--orange);color:#fff}
.btn-danger{background:var(--red);color:#fff}.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;min-width:480px;max-width:680px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--blue)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.timeline{border-left:2px solid var(--blue);margin:12px 0 12px 8px;padding-left:16px}
.timeline-item{position:relative;margin-bottom:16px}
.timeline-item:before{content:'';position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.timeline-item .t-time{font-size:12px;color:#999}
.timeline-item .t-actor{font-size:13px;font-weight:600;color:var(--blue)}
.timeline-item .t-note{font-size:13px;color:#555;margin-top:2px}
.flex{display:flex}.gap8{gap:8px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.text-center{text-align:center}.text-right{text-align:right}
.text-green{color:var(--green)}.text-red{color:var(--red)}.text-orange{color:var(--orange)}
.text-grey{color:var(--grey)}.text-blue{color:var(--blue)}
.fw700{font-weight:700}.fs12{font-size:12px}.fs16{font-size:16px}.fs20{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.notice{background:#fff3e0;border-left:4px solid var(--orange);padding:12px 16px;border-radius:4px;font-size:13px;color:#e65100;margin-bottom:16px}
.notice-blue{background:#e3f2fd;border-left:4px solid var(--blue);padding:12px 16px;border-radius:4px;font-size:13px;color:#1565c0;margin-bottom:16px}
.clickable{cursor:pointer}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}

.phone-frame{width:375px;height:720px;margin:20px auto;border:8px solid #333;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.15)}

.dash-dark .chart-dom{width:100%;height:calc(100% - 10px);min-height:280px}
.dash-dark .stat-item-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}

.dash-dark .stat-num{font-size:24px;color:#fff;font-weight:bold}
.dash-dark .dash-select{background:#0a2042;color:#c6e2ff;border:1px solid #255994;padding:2px 4px;font-size:13px}
.dash-dark .dash-btn{background:#103468;border:1px solid #266099;color:#fff;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:13px}
.dash-dark .dash-btn-alt{background:#081c38;border:1px solid #1c4475;color:#88aacc;padding:3px 6px;cursor:pointer;font-size:13px}

var pPage = 'home';

var pPrefillFeedback = null;
var pNotOrdered = [];

function pNav(page, el) {
  pPage = page;

  el.classList.add('active');

}
function pRender() {
  var c = document.getElementById('phoneContent');
  var pages = {home:pHome,order:pOrder,feedback:pFeedback};
  c.innerHTML = pages[pPage]();
}
function pBadge(s) {
  var m = {'待订购':'badge-orange','已订购':'badge-green','待处理':'badge-red','处理中':'badge-orange','已超时':'badge-red','已解决':'badge-green','无需处理':'badge-grey','待填写':'badge-orange','已收货':'badge-green','待收货':'badge-orange','免费':'badge-green'};

}
function pModal(html){document.getElementById('phoneContent').innerHTML+='<div class="modal-overlay show" style="position:absolute" onclick="if(event.target.classList.contains(\'modal-overlay\'))pRender()"><div class="modal" style="min-width:300px;max-width:340px;margin:10px">'+html+'</div></div>';}

function pOrderBook(id){var t=D.parentTextbooks.find(function(x){return x.id===id});var oid='JZ'+String(D.parentOrders.length+1).padStart(3,'0');D.parentOrders.unshift({id:oid,textbook:t.name,amount:t.price,status:'待收货',date:'2026-08-10',free:t.free,delivered:false,evaluated:false,score:0});D.parentTextbooks=D.parentTextbooks.filter(function(x){return x.id!==id});pRender();}
function pNotOrder(id){pNotOrdered.push(id);pRender();}
function pShowOrder(id){var o=D.parentOrders.find(function(x){return x.id===id});var h='<div class="modal-title">订单详情 - '+o.id+'</div>';h+='<div class="form-row"><div class="form-label" style="width:70px">教辅</div><div class="form-input" style="border:none">'+o.textbook+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:70px">金额</div><div class="form-input" style="border:none">\u00a5'+o.amount+(o.free?'（免费）':'')+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:70px">日期</div><div class="form-input" style="border:none">'+o.date+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:70px">状态</div><div class="form-input" style="border:none">'+pBadge(o.status)+'</div></div>';if(o.delivered&&!o.evaluated){h+='<div class="card-title" style="margin-top:16px">收货评价</div>';h+='<div class="info mb8">已确认收货，请对书籍进行满意度评价：</div>';h+='<div class="stars" id="ostar" style="margin-bottom:12px">';for(var i=1;i<=5;i++)h+='<span onclick="pOStar('+i+')">&#9733;</span>';h+='</div>';h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">关闭</button><button class="btn btn-success" onclick="pSubmitEval(\''+o.id+'\')">提交评价</button></div>';}else if(o.delivered&&o.evaluated){h+='<div class="info mt16">已评价：'+o.score+'星</div>';}else{h+='<div class="info mt16">订单已下单，等待配送中。收到教辅后请确认收货。</div>';h+='<div class="modal-actions"><button class="btn btn-primary" onclick="pConfirmReceive(\''+o.id+'\')">确认收货</button></div>';}h+='<div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="pJumpFeedback(\''+o.id+'\')">如有问题可意见反馈</button></div>';h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">关闭</button></div>';pModal(h);}
function pJumpFeedback(orderId){var o=D.parentOrders.find(function(x){return x.id===orderId});pPrefillFeedback={type:'教辅投诉',content:'订单号：'+o.id+'\n教辅：'+o.textbook+'\n问题描述：'};document.querySelectorAll('.phone-tab')[2].click();}
function pOStar(n){var ss=document.getElementById('ostar').querySelectorAll('span');ss.forEach(function(s,i){s.className=i<n?'on':'';});}
function pConfirmReceive(id){var o=D.parentOrders.find(function(x){return x.id===id});o.delivered=true;o.status='已收货';pRender();pShowOrder(id);}
function pSubmitEval(id){var ss=document.getElementById('ostar').querySelectorAll('span.on');var score=ss.length;if(score===0){alert('请选择评分星级');return;}var o=D.parentOrders.find(function(x){return x.id===id});o.evaluated=true;o.score=score;pRender();alert('评价已提交，感谢您的反馈');}

  return h;
}
function pShowFeedback(id){var f=D.parentFeedbacks.find(function(x){return x.id===id});var h='<div class="modal-title">反馈处理进度 - '+f.id+'</div>';h+='<div class="form-row"><div class="form-label" style="width:60px">类型</div><div class="form-input" style="border:none">'+f.type+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:60px">级别</div><div class="form-input" style="border:none">'+f.level+(f.submitCount>=3?'（已自动升级）':'')+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:60px">状态</div><div class="form-input" style="border:none">'+pBadge(f.status)+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:60px">内容</div><div class="form-input" style="border:none">'+f.content+'</div></div>';h+='<div class="card-title" style="margin-top:12px">处理记录</div>';if(f.timeline.length===0){h+='<p class="text-grey" style="padding:8px">暂无处理记录，学校将尽快处理。</p>';}else{h+='<div class="timeline">';f.timeline.forEach(function(t){h+='<div class="timeline-item"><div class="t-time">'+t.time+'</div><div class="t-actor">'+t.actor+' - '+t.action+'</div><div class="t-note">'+t.note+'</div></div>';});h+='</div>';}h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">关闭</button></div>';pModal(h);}

pRender();
</script>
</body>
</html>
