<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教辅监管 家长端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a3c6e;--blue2:#2d5a9e;--bg:#f0f2f5;--green:#4caf50;--orange:#ff9800;--red:#f44336;--grey:#90a4ae}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#333;font-size:14px}
a{text-decoration:none;color:inherit}
.sidebar{width:200px;background:var(--blue);color:#fff;height:100vh;position:fixed;left:0;top:0;overflow-y:auto}
.sidebar .logo{padding:20px 16px;font-size:15px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.15);text-align:center;line-height:1.4}
.sidebar .nav-item{padding:12px 20px;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:8px}
.sidebar .nav-item:hover{background:rgba(255,255,255,.1)}
.sidebar .nav-item.active{background:rgba(255,255,255,.15);border-left:3px solid #fff}
.sidebar .nav-icon{width:20px;text-align:center;font-size:16px}
.main{margin-left:200px;min-height:100vh}
.topbar{background:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.topbar .page-title{font-size:16px;font-weight:600;color:var(--blue)}
.role-switch{display:flex;gap:0;border:1px solid var(--blue);border-radius:4px;overflow:hidden}
.role-switch button{padding:6px 14px;border:none;background:#fff;color:var(--blue);cursor:pointer;font-size:13px;transition:all .2s}
.role-switch button.active{background:var(--blue);color:#fff}
.content{padding:20px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.stat-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:200px;background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px}
.stat-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.stat-info .num{font-size:24px;font-weight:700;color:#333}
.stat-info .label{font-size:13px;color:#999;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--blue);color:#fff;padding:10px 12px;text-align:left;font-weight:500;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eee}
tr:nth-child(even){background:#f9f9f9}
tr:hover{background:#e3f2fd}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.badge-green{background:#e8f5e9;color:var(--green)}.badge-orange{background:#fff3e0;color:var(--orange)}
.badge-red{background:#ffebee;color:var(--red)}.badge-grey{background:#eceff1;color:var(--grey)}
.badge-blue{background:#e3f2fd;color:var(--blue)}
.sub-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--blue);flex-wrap:wrap}
.sub-tab{padding:8px 20px;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.sub-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.sub-page{display:none}.sub-page.active{display:block}
.bar-chart{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:120px;font-size:13px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:600}
.pie{width:120px;height:120px;border-radius:50%;position:relative;margin:0 auto}
.pie-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.pie-legend .dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px}
.form-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.form-label{width:100px;text-align:right;font-size:13px;color:#666;flex-shrink:0;padding-top:8px}
.form-input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.form-select{padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px;background:#fff}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-success{background:var(--green);color:#fff}.btn-warn{background:var(--orange);color:#fff}
.btn-danger{background:var(--red);color:#fff}.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;min-width:480px;max-width:680px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--blue)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.timeline{border-left:2px solid var(--blue);margin:12px 0 12px 8px;padding-left:16px}
.timeline-item{position:relative;margin-bottom:16px}
.timeline-item:before{content:'';position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.timeline-item .t-time{font-size:12px;color:#999}
.timeline-item .t-actor{font-size:13px;font-weight:600;color:var(--blue)}
.timeline-item .t-note{font-size:13px;color:#555;margin-top:2px}
.flex{display:flex}.gap8{gap:8px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.text-center{text-align:center}.text-right{text-align:right}
.text-green{color:var(--green)}.text-red{color:var(--red)}.text-orange{color:var(--orange)}
.text-grey{color:var(--grey)}.text-blue{color:var(--blue)}
.fw700{font-weight:700}.fs12{font-size:12px}.fs16{font-size:16px}.fs20{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.notice{background:#fff3e0;border-left:4px solid var(--orange);padding:12px 16px;border-radius:4px;font-size:13px;color:#e65100;margin-bottom:16px}
.notice-blue{background:#e3f2fd;border-left:4px solid var(--blue);padding:12px 16px;border-radius:4px;font-size:13px;color:#1565c0;margin-bottom:16px}
.clickable{cursor:pointer}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar .form-select,.filter-bar .form-input{min-width:120px}
.phone-frame{width:375px;height:720px;margin:20px auto;border:8px solid #333;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.phone-screen{width:100%;height:100%;overflow-y:auto;background:#f5f5f5;position:relative}
.phone-header{background:var(--blue);color:#fff;padding:12px 16px;font-size:16px;font-weight:600;text-align:center;position:sticky;top:0;z-index:10}
.phone-tabbar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;display:flex;border-top:1px solid #eee;box-shadow:0 -1px 4px rgba(0,0,0,.06)}
.phone-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#999;cursor:pointer}
.phone-tab.active{color:var(--blue)}
.phone-tab .tab-icon{font-size:20px}
.phone-page{display:none;padding:12px;padding-bottom:70px}.phone-page.active{display:block}
.phone-card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.phone-card .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phone-card .card-h .t{font-size:14px;font-weight:600;color:#333}
.phone-card .card-h .p{font-size:16px;font-weight:700;color:var(--blue)}
.phone-card .info{font-size:12px;color:#999;line-height:1.6}
.phone-banner{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:16px;border-radius:8px;margin-bottom:12px}
.phone-banner .b-num{font-size:28px;font-weight:700}
.phone-banner .b-label{font-size:12px;opacity:.8}
.stars{display:flex;gap:2px}.stars span{font-size:22px;cursor:pointer;color:#ccc}.stars span.on{color:#ff9800}
.detail-section{background:#f9f9f9;border-radius:8px;padding:16px;margin-bottom:12px}
.detail-section .section-title{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e0e0e0}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
.funnel-container{display:flex;flex-direction:column;align-items:center;gap:0;margin:16px 0}
.funnel-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;color:#fff;font-size:13px;border-radius:4px;min-width:300px;transition:width .5s;font-weight:500}
.funnel-arrow{font-size:11px;color:#999;padding:3px 0}
.dash-dark{background:#061024;background-image:radial-gradient(#0f2448 0.5px,transparent 0.5px);background-size:24px 24px;color:#c6e2ff;min-height:calc(100vh - 56px);margin:-20px;padding:16px 8px;overflow-y:auto}
.dash-dark .top-kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.dash-dark .kpi-card{background:linear-gradient(135deg,#0f2b5288,#08193888);border:1px solid #1b589980;border-radius:6px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.dash-dark .kpi-icon{width:48px;height:48px;background:#0077cc44;display:flex;align-items:center;justify-content:center;color:#39c0ff;font-size:26px;flex-shrink:0}
.dash-dark .kpi-main-num{font-size:32px;color:#fff;font-weight:bold}
.dash-dark .kpi-desc-text{font-size:14px;color:#91c3ee}
.dash-dark .grid-row-2,.dash-dark .grid-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.dash-dark .single-card-wrap{display:grid;grid-template-columns:1fr}
.dash-dark .panel-card{background:linear-gradient(135deg,#0f234477,#07173377);border:1px solid #1b589970;border-radius:6px;min-height:360px;display:flex;flex-direction:column}
.dash-dark .panel-title{font-size:18px;color:#66ccff;padding:12px 16px;border-bottom:1px solid #17407266;display:flex;align-items:center}
.dash-dark .panel-content{flex:1;padding:12px 16px;overflow:hidden}
.dash-dark .warn-tag-group{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.dash-dark .warn-tag{background:#0e2b5099;text-align:center;padding:6px 0;font-size:13px;border-radius:3px;color:#c6e2ff}
.dash-dark .warn-list-item{font-size:13px;line-height:28px;padding-left:4px;color:#c6e2ff}
.dash-dark .risk-box{float:right;width:160px;background:#0c2246;border:1px solid #226099;padding:8px;border-radius:4px;color:#c6e2ff}
.dash-dark .data-table{width:100%;border-collapse:collapse;font-size:13px}
.dash-dark .data-table th{background:#10346888;padding:8px 4px;text-align:left;border:1px solid #1b488077;color:#c6e2ff}
.dash-dark .data-table td{padding:7px 4px;border:1px solid #14335c66;color:#c6e2ff;background:#0a1f3e}
.dash-dark .data-table tr:nth-child(even){background:#0d2748}
.dash-dark .data-table tr:hover{background:#143660}
.dash-dark .chart-dom{width:100%;height:calc(100% - 10px);min-height:280px}
.dash-dark .stat-item-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.dash-dark .stat-item-box{background:#0e274d88;padding:10px;display:flex;align-items:center;gap:8px}
.dash-dark .stat-num{font-size:24px;color:#fff;font-weight:bold}
.dash-dark .dash-select{background:#0a2042;color:#c6e2ff;border:1px solid #255994;padding:2px 4px;font-size:13px}
.dash-dark .dash-btn{background:#103468;border:1px solid #266099;color:#fff;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:13px}
.dash-dark .dash-btn-alt{background:#081c38;border:1px solid #1c4475;color:#88aacc;padding:3px 6px;cursor:pointer;font-size:13px}
/* 语言切换按钮（右下角 中/EN，与主站一致） */
.lang-toggle{position:fixed;bottom:18px;right:18px;z-index:2000;display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.9);border:1px solid rgba(26,60,110,.4);border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.18);backdrop-filter:blur(6px)}
.lang-opt{border:none;background:transparent;color:#5a7ca6;font-size:13px;letter-spacing:1px;padding:5px 14px;border-radius:24px;cursor:pointer;transition:all .3s ease;font-family:inherit}
.lang-opt.active{background:var(--blue);color:#fff}
.lang-opt:hover:not(.active){color:var(--blue)}
</style>
</head>

  '订购缴费截止8月15日，请尽快完成。':'The payment deadline is Aug 15. Please complete it soon.','已联系出版社核实，请耐心等待。':'The publisher has been contacted for verification. Please wait patiently.','仍未解决，答案依旧有误。':'Still unresolved — the answers remain incorrect.','同一诉求提交3次，自动转派至区县教委。':'The same request was submitted 3 times and has been automatically transferred to the district education commission.','请学校管理员尽快对接出版社更换，限3日内反馈。':'School admins should contact the publisher for a replacement ASAP; feedback is required within 3 days.','价格为市级目录定价。':'The price follows the municipal catalog pricing.','请学校向家长解释定价依据，并记录反馈。':'The school should explain the pricing basis to parents and record the feedback.','经核实为预征订数，实际按订购数发货，已向家长说明。':'Verified as a pre-order count; delivery is based on actual orders. Parents have been informed.','一本为区县定版，一本为学校自主选品。':'One is the district-designated edition; the other is chosen by the school.','请学校核实是否违规，暂停自主选品。':'The school should verify compliance and suspend independent selection.','区县无法处理，升级至市教委。':'The district could not resolve it; escalated to the Municipal Education Commission.','经核实为运输磨损，已联系新华书店更换。':'Verified as transport wear; Xinhua Bookstore has been contacted for a replacement.',
  '教辅照片1.jpg':'Material photo 1.jpg','教辅照片2.jpg':'Material photo 2.jpg','答案错误照片.jpg':'Wrong-answer photo.jpg','价格对比截图.png':'Price comparison screenshot.png','教辅清单照片.jpg':'Material list photo.jpg','封面照片.jpg':'Cover photo.jpg',
  '2026年秋季教辅满意度调查':'2026 Fall Material Satisfaction Survey','同步练习册质量专项问卷':'Workbook Quality Special Survey',
  '教辅内容质量评分':'Content quality rating','教辅印刷质量评分':'Print quality rating','教辅价格合理性评分':'Price reasonableness rating','整体满意度评分':'Overall satisfaction rating','内容质量评分':'Content quality rating','印刷质量评分':'Print quality rating','难度适宜度评分':'Difficulty suitability rating',
  '关于2026年秋季教辅征订工作的通知':'Notice on 2026 Fall Material Ordering','XX区教辅征订结果公示':'XX District Ordering Results Publicity','教辅满意度调查问卷发放通知':'Satisfaction Survey Distribution Notice',
  '非常满意':'Very Satisfied','满意':'Satisfied','基本满意':'Neutral','较不满意':'Dissatisfied','不满意':'Very Dissatisfied','参评人数':'Participants','人均经费':'Per-student Funding','平均值':'Average','未整改':'Unresolved',
  '1月':'Jan','2月':'Feb','3月':'Mar','4月':'Apr','5月':'May','6月':'Jun','7月':'Jul','8月':'Aug','9月':'Sep','10月':'Oct','11月':'Nov'
};
var t = function(k){ return (I18N[currentLang] && I18N[currentLang][k] !== undefined) ? I18N[currentLang][k] : (I18N.zh[k] !== undefined ? I18N.zh[k] : k); };
var dt = function(s){ return (currentLang === 'en' && Object.prototype.hasOwnProperty.call(DT, s)) ? DT[s] : s; };
var dtCls = function(s){ // '三年级1班' / '三年级1-4班'
  if (currentLang !== 'en') return s;
  var m = s.match(/^(.+?年级)(\d+)(?:-(\d+))?班$/);
  if (m) return dt(m[1]) + ' Class ' + m[2] + (m[3] ? '-' + m[3] : '');
  return s;
};
function applyLang() {
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){ el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder'))); });
  document.querySelectorAll('.lang-opt').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === currentLang); });
  document.getElementById('phoneHeader').textContent = t(titles[pPage]);
  pRender();
}
document.querySelectorAll('.lang-opt').forEach(function(btn){
  btn.addEventListener('click', function(){
    if (btn.dataset.lang === currentLang) return;
    currentLang = btn.dataset.lang;
    try { localStorage.setItem('mh-lang', currentLang); } catch(e) {}
    applyLang();
  });
});

function pNav(page, el) {
  pPage = page;
  document.querySelectorAll('.phone-tab').forEach(function(tt){tt.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('phoneHeader').textContent = t(titles[pPage]);
  pRender();
}
function pRender() {
  var c = document.getElementById('phoneContent');
  var pages = {home:pHome,order:pOrder,feedback:pFeedback};
  c.innerHTML = pages[pPage]();
}
function pBadge(s) {
  var m = {'待订购':'badge-orange','已订购':'badge-green','待处理':'badge-red','处理中':'badge-orange','已超时':'badge-red','已解决':'badge-green','无需处理':'badge-grey','待填写':'badge-orange','已收货':'badge-green','待收货':'badge-orange','免费':'badge-green'};
  return '<span class="badge '+(m[s]||'badge-grey')+'">'+dt(s)+'</span>';
}
function pModal(html){document.getElementById('phoneContent').innerHTML+='<div class="modal-overlay show" style="position:absolute" onclick="if(event.target.classList.contains(\'modal-overlay\'))pRender()"><div class="modal" style="min-width:300px;max-width:340px;margin:10px">'+html+'</div></div>';}

function pHome() {
  var h = '<div class="phone-page active">';
  h += '<div class="phone-banner"><div class="b-label">'+t('parentUser')+'</div><div style="font-size:18px;font-weight:600">'+dt('张小明家长')+'</div><div class="b-label" style="margin-top:4px">'+dt('XX区第一小学')+' '+dtCls('三年级2班')+'</div></div>';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('orderReminder')+'</span></div><div class="info">'+t('reminderInfo').replace('{n}',D.parentTextbooks.length)+'</div><button class="btn btn-primary btn-sm mt8" onclick="document.querySelectorAll(\'.phone-tab\')[1].click()">'+t('goOrder')+'</button></div>';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('surveyTitle')+'</span>'+pBadge('待填写')+'</div><div class="info">'+dt(D.parentQuestionnaires[0].title)+'</div><button class="btn btn-primary btn-sm mt8" onclick="pShowQuestionnaire()">'+t('goFill')+'</button></div>';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('latestNotice')+'</span></div>';
  D.announcements.forEach(function(a){h+='<div style="padding:6px 0;border-bottom:1px solid #f0f0f0"><div style="font-size:13px">'+dt(a.title)+'</div><div class="info">'+dt(a.org)+' | '+a.date+'</div></div>';});
  h += '</div></div>';
  return h;
}
function pShowQuestionnaire(){var q=D.parentQuestionnaires[0];var h='<div class="modal-title">'+dt(q.title)+'</div>';q.questions.forEach(function(item,idx){h+='<div style="margin-bottom:12px"><div style="font-size:13px;margin-bottom:6px">'+(idx+1)+'. '+dt(item)+'</div><div class="stars" id="star'+idx+'">';for(var i=1;i<=5;i++)h+='<span onclick="pStar('+idx+','+i+')">&#9733;</span>';h+='</div></div>';});h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="alert(t(\'alertSurveyDone\'));pRender()">'+t('submitSurvey')+'</button></div>';pModal(h);}
function pStar(idx,n){var ss=document.getElementById('star'+idx).querySelectorAll('span');ss.forEach(function(s,i){s.className=i<n?'on':'';});}

function pOrder() {
  var h = '<div class="phone-page active">';
  h += '<div class="notice" style="margin:0 0 10px 0">'+t('orderNotice')+'</div>';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('pendingList')+'</span></div>';
  D.parentTextbooks.forEach(function(tb){
    var notOrdered = pNotOrdered.indexOf(tb.id) >= 0;
    var info = dt(tb.subject)+' | '+dt(tb.publisher)+' | \u00a5'+tb.price;
    if(notOrdered){
      h+='<div style="padding:8px 0;border-bottom:1px solid #f0f0f0"><div style="font-size:13px;font-weight:600">'+dt(tb.name)+' <span class="badge badge-grey">'+t('declined')+'</span></div><div class="info">'+info+'</div><div class="mt8"><button class="btn btn-primary btn-sm" disabled>'+t('orderNow')+'</button> <button class="btn btn-outline btn-sm" disabled>'+t('decline')+'</button></div></div>';
    } else {
      h+='<div style="padding:8px 0;border-bottom:1px solid #f0f0f0"><div style="font-size:13px;font-weight:600">'+dt(tb.name)+'</div><div class="info">'+info+'</div><div class="mt8"><button class="btn btn-primary btn-sm" onclick="pOrderBook('+tb.id+')">'+t('orderNow')+'</button> <button class="btn btn-outline btn-sm" onclick="pNotOrder('+tb.id+')">'+t('decline')+'</button></div></div>';
    }
  });
  h += '</div>';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('orderedRecords')+'</span></div>';
  D.parentOrders.forEach(function(o){h+='<div style="padding:8px 0;border-bottom:1px solid #f0f0f0"><div style="font-size:13px;font-weight:600">'+dt(o.textbook)+'</div><div class="info">\u00a5'+o.amount+' | '+o.date+' | '+pBadge(o.status)+'</div><div class="mt8"><button class="btn btn-outline btn-sm" onclick="pShowOrder(\''+o.id+'\')">'+t('orderDetailBtn')+'</button></div></div>';});
  h += '</div></div>';
  return h;
}
function pOrderBook(id){var tb=D.parentTextbooks.find(function(x){return x.id===id});var oid='JZ'+String(D.parentOrders.length+1).padStart(3,'0');D.parentOrders.unshift({id:oid,textbook:tb.name,amount:tb.price,status:'待收货',date:'2026-08-10',free:tb.free,delivered:false,evaluated:false,score:0});D.parentTextbooks=D.parentTextbooks.filter(function(x){return x.id!==id});pRender();}
function pNotOrder(id){pNotOrdered.push(id);pRender();}
function pShowOrder(id){var o=D.parentOrders.find(function(x){return x.id===id});var h='<div class="modal-title">'+t('orderDetailTitle')+' - '+o.id+'</div>';h+='<div class="form-row"><div class="form-label" style="width:70px">'+t('itemLabel')+'</div><div class="form-input" style="border:none">'+dt(o.textbook)+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:70px">'+t('amountLabel')+'</div><div class="form-input" style="border:none">\u00a5'+o.amount+(o.free?t('freeParen'):'')+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:70px">'+t('dateLabel')+'</div><div class="form-input" style="border:none">'+o.date+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:70px">'+t('statusLabel')+'</div><div class="form-input" style="border:none">'+pBadge(o.status)+'</div></div>';if(o.delivered&&!o.evaluated){h+='<div class="card-title" style="margin-top:16px">'+t('receiveEvalTitle')+'</div>';h+='<div class="info mb8">'+t('evalPrompt')+'</div>';h+='<div class="stars" id="ostar" style="margin-bottom:12px">';for(var i=1;i<=5;i++)h+='<span onclick="pOStar('+i+')">&#9733;</span>';h+='</div>';h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">'+t('close')+'</button><button class="btn btn-success" onclick="pSubmitEval(\''+o.id+'\')">'+t('submitEval')+'</button></div>';}else if(o.delivered&&o.evaluated){h+='<div class="info mt16">'+t('evaluatedStars').replace('{n}',o.score)+'</div>';}else{h+='<div class="info mt16">'+t('waitingMsg')+'</div>';h+='<div class="modal-actions"><button class="btn btn-primary" onclick="pConfirmReceive(\''+o.id+'\')">'+t('confirmReceive')+'</button></div>';}h+='<div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="pJumpFeedback(\''+o.id+'\')">'+t('toFeedback')+'</button></div>';h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">'+t('close')+'</button></div>';pModal(h);}
function pJumpFeedback(orderId){var o=D.parentOrders.find(function(x){return x.id===orderId});pPrefillFeedback={type:'教辅投诉',content:t('fbPrefillContent').replace('{id}',o.id).replace('{name}',dt(o.textbook))};document.querySelectorAll('.phone-tab')[2].click();}
function pOStar(n){var ss=document.getElementById('ostar').querySelectorAll('span');ss.forEach(function(s,i){s.className=i<n?'on':'';});}
function pConfirmReceive(id){var o=D.parentOrders.find(function(x){return x.id===id});o.delivered=true;o.status='已收货';pRender();pShowOrder(id);}
function pSubmitEval(id){var ss=document.getElementById('ostar').querySelectorAll('span.on');var score=ss.length;if(score===0){alert(t('alertPickStars'));return;}var o=D.parentOrders.find(function(x){return x.id===id});o.evaluated=true;o.score=score;pRender();alert(t('alertEvalDone'));}

function pFeedback() {
  var h = '<div class="phone-page active">';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('fbSubmitTitle')+'</span></div>';
  var pf=pPrefillFeedback;var pType=pf?pf.type:'教辅咨询';var pContent=pf?pf.content:'';
  h += '<div class="form-row"><div class="form-label" style="width:60px">'+t('typeLabel')+'</div><select class="form-select" id="pf_type"><option value="教辅咨询"'+(pType==='教辅咨询'?' selected':'')+'>'+dt('教辅咨询')+'</option><option value="教辅投诉"'+(pType==='教辅投诉'?' selected':'')+'>'+dt('教辅投诉')+'</option></select></div>';
  h += '<div class="form-row"><div class="form-label" style="width:60px">'+t('contentLabel')+'</div><textarea class="form-input" id="pf_content" rows="3" placeholder="'+t('contentPlaceholder')+'">'+pContent+'</textarea></div>';
  h += '<button class="btn btn-primary" style="width:100%" onclick="pPrefillFeedback=null;alert(t(\'alertFbDone\'));pRender()">'+t('submitFbBtn')+'</button>';
  h += '<div class="notice mt16" style="margin-bottom:0">'+t('afterSalesNotice')+'</div>';
  h += '</div>';
  h += '<div class="phone-card"><div class="card-h"><span class="t">'+t('myFeedback')+'</span></div>';
  D.parentFeedbacks.forEach(function(f){
    h += '<div style="padding:8px 0;border-bottom:1px solid #f0f0f0"><div style="font-size:13px">'+dt(f.content)+'</div><div class="info">'+dt(f.type)+' | '+dt(f.level)+' | '+f.date+' | '+t('submitTimes').replace('{n}',f.submitCount)+' | '+pBadge(f.status)+'</div>';
    h += '<button class="btn btn-outline btn-sm mt8" onclick="pShowFeedback(\''+f.id+'\')">'+t('viewProgress')+'</button></div>';
  });
  h += '<div class="info mt8">'+t('escalateNote')+'</div>';
  h += '</div></div>';
  return h;
}
function pShowFeedback(id){var f=D.parentFeedbacks.find(function(x){return x.id===id});var h='<div class="modal-title">'+t('fbProgressTitle')+' - '+f.id+'</div>';h+='<div class="form-row"><div class="form-label" style="width:60px">'+t('typeLabel')+'</div><div class="form-input" style="border:none">'+dt(f.type)+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:60px">'+t('levelLabel')+'</div><div class="form-input" style="border:none">'+dt(f.level)+(f.submitCount>=3?t('autoEscalated'):'')+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:60px">'+t('statusLabel')+'</div><div class="form-input" style="border:none">'+pBadge(f.status)+'</div></div>';h+='<div class="form-row"><div class="form-label" style="width:60px">'+t('contentLabel')+'</div><div class="form-input" style="border:none">'+dt(f.content)+'</div></div>';h+='<div class="card-title" style="margin-top:12px">'+t('processRecords')+'</div>';if(f.timeline.length===0){h+='<p class="text-grey" style="padding:8px">'+t('noRecordsYet')+'</p>';}else{h+='<div class="timeline">';f.timeline.forEach(function(ti){h+='<div class="timeline-item"><div class="t-time">'+ti.time+'</div><div class="t-actor">'+dt(ti.actor)+' - '+dt(ti.action)+'</div><div class="t-note">'+dt(ti.note)+'</div></div>';});h+='</div>';}h+='<div class="modal-actions"><button class="btn btn-outline" onclick="pRender()">'+t('close')+'</button></div>';pModal(h);}

applyLang();
</script>
</body>
</html>
