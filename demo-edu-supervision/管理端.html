<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教辅监管平台 管理端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a3c6e;--blue2:#2d5a9e;--bg:#f0f2f5;--green:#4caf50;--orange:#ff9800;--red:#f44336;--grey:#90a4ae}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#333;font-size:14px}
a{text-decoration:none;color:inherit}
.sidebar{width:200px;background:var(--blue);color:#fff;height:100vh;position:fixed;left:0;top:0;overflow-y:auto}
.sidebar .logo{padding:20px 16px;font-size:15px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.15);text-align:center;line-height:1.4}
.sidebar .nav-item{padding:12px 20px;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:8px}
.sidebar .nav-item:hover{background:rgba(255,255,255,.1)}
.sidebar .nav-item.active{background:rgba(255,255,255,.15);border-left:3px solid #fff}
.sidebar .nav-icon{width:20px;text-align:center;font-size:16px}
.main{margin-left:200px;min-height:100vh}
.topbar{background:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.topbar .page-title{font-size:16px;font-weight:600;color:var(--blue)}
.role-switch{display:flex;gap:0;border:1px solid var(--blue);border-radius:4px;overflow:hidden}
.role-switch button{padding:6px 14px;border:none;background:#fff;color:var(--blue);cursor:pointer;font-size:13px;transition:all .2s}
.role-switch button.active{background:var(--blue);color:#fff}
.content{padding:20px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.stat-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:200px;background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px}
.stat-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.stat-info .num{font-size:24px;font-weight:700;color:#333}
.stat-info .label{font-size:13px;color:#999;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--blue);color:#fff;padding:10px 12px;text-align:left;font-weight:500;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eee}
tr:nth-child(even){background:#f9f9f9}
tr:hover{background:#e3f2fd}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.badge-green{background:#e8f5e9;color:var(--green)}.badge-orange{background:#fff3e0;color:var(--orange)}
.badge-red{background:#ffebee;color:var(--red)}.badge-grey{background:#eceff1;color:var(--grey)}
.badge-blue{background:#e3f2fd;color:var(--blue)}
.sub-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--blue);flex-wrap:wrap}
.sub-tab{padding:8px 20px;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.sub-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.sub-page{display:none}.sub-page.active{display:block}
.bar-chart{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:120px;font-size:13px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:600}
.pie{width:120px;height:120px;border-radius:50%;position:relative;margin:0 auto}
.pie-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.pie-legend .dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px}
.form-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.form-label{width:100px;text-align:right;font-size:13px;color:#666;flex-shrink:0;padding-top:8px}
.form-input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.form-select{padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px;background:#fff}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-success{background:var(--green);color:#fff}.btn-warn{background:var(--orange);color:#fff}
.btn-danger{background:var(--red);color:#fff}.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;min-width:480px;max-width:680px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--blue)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.timeline{border-left:2px solid var(--blue);margin:12px 0 12px 8px;padding-left:16px}
.timeline-item{position:relative;margin-bottom:16px}
.timeline-item:before{content:'';position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.timeline-item .t-time{font-size:12px;color:#999}
.timeline-item .t-actor{font-size:13px;font-weight:600;color:var(--blue)}
.timeline-item .t-note{font-size:13px;color:#555;margin-top:2px}
.flex{display:flex}.gap8{gap:8px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.text-center{text-align:center}.text-right{text-align:right}
.text-green{color:var(--green)}.text-red{color:var(--red)}.text-orange{color:var(--orange)}
.text-grey{color:var(--grey)}.text-blue{color:var(--blue)}
.fw700{font-weight:700}.fs12{font-size:12px}.fs16{font-size:16px}.fs20{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.notice{background:#fff3e0;border-left:4px solid var(--orange);padding:12px 16px;border-radius:4px;font-size:13px;color:#e65100;margin-bottom:16px}
.notice-blue{background:#e3f2fd;border-left:4px solid var(--blue);padding:12px 16px;border-radius:4px;font-size:13px;color:#1565c0;margin-bottom:16px}
.clickable{cursor:pointer}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar .form-select,.filter-bar .form-input{min-width:120px}
.phone-frame{width:375px;height:720px;margin:20px auto;border:8px solid #333;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.phone-screen{width:100%;height:100%;overflow-y:auto;background:#f5f5f5;position:relative}
.phone-header{background:var(--blue);color:#fff;padding:12px 16px;font-size:16px;font-weight:600;text-align:center;position:sticky;top:0;z-index:10}
.phone-tabbar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;display:flex;border-top:1px solid #eee;box-shadow:0 -1px 4px rgba(0,0,0,.06)}
.phone-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#999;cursor:pointer}
.phone-tab.active{color:var(--blue)}
.phone-tab .tab-icon{font-size:20px}
.phone-page{display:none;padding:12px;padding-bottom:70px}.phone-page.active{display:block}
.phone-card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.phone-card .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phone-card .card-h .t{font-size:14px;font-weight:600;color:#333}
.phone-card .card-h .p{font-size:16px;font-weight:700;color:var(--blue)}
.phone-card .info{font-size:12px;color:#999;line-height:1.6}
.phone-banner{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:16px;border-radius:8px;margin-bottom:12px}
.phone-banner .b-num{font-size:28px;font-weight:700}
.phone-banner .b-label{font-size:12px;opacity:.8}
.stars{display:flex;gap:2px}.stars span{font-size:22px;cursor:pointer;color:#ccc}.stars span.on{color:#ff9800}
.detail-section{background:#f9f9f9;border-radius:8px;padding:16px;margin-bottom:12px}
.detail-section .section-title{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e0e0e0}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
.funnel-container{display:flex;flex-direction:column;align-items:center;gap:0;margin:16px 0}
.funnel-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;color:#fff;font-size:13px;border-radius:4px;min-width:300px;transition:width .5s;font-weight:500}
.funnel-arrow{font-size:11px;color:#999;padding:3px 0}
.dash-dark{background:#061024;background-image:radial-gradient(#0f2448 0.5px,transparent 0.5px);background-size:24px 24px;color:#c6e2ff;min-height:calc(100vh - 56px);margin:-20px;padding:16px 8px;overflow-y:auto}
.dash-dark .top-kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.dash-dark .kpi-card{background:linear-gradient(135deg,#0f2b5288,#08193888);border:1px solid #1b589980;border-radius:6px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.dash-dark .kpi-icon{width:48px;height:48px;background:#0077cc44;display:flex;align-items:center;justify-content:center;color:#39c0ff;font-size:26px;flex-shrink:0}
.dash-dark .kpi-main-num{font-size:32px;color:#fff;font-weight:bold}
.dash-dark .kpi-desc-text{font-size:14px;color:#91c3ee}
.dash-dark .grid-row-2,.dash-dark .grid-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.dash-dark .single-card-wrap{display:grid;grid-template-columns:1fr}
.dash-dark .panel-card{background:linear-gradient(135deg,#0f234477,#07173377);border:1px solid #1b589970;border-radius:6px;min-height:360px;display:flex;flex-direction:column}
.dash-dark .panel-title{font-size:18px;color:#66ccff;padding:12px 16px;border-bottom:1px solid #17407266;display:flex;align-items:center}
.dash-dark .panel-content{flex:1;padding:12px 16px;overflow:hidden}
.dash-dark .warn-tag-group{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.dash-dark .warn-tag{background:#0e2b5099;text-align:center;padding:6px 0;font-size:13px;border-radius:3px;color:#c6e2ff}
.dash-dark .warn-list-item{font-size:13px;line-height:28px;padding-left:4px;color:#c6e2ff}
.dash-dark .risk-box{float:right;width:160px;background:#0c2246;border:1px solid #226099;padding:8px;border-radius:4px;color:#c6e2ff}
.dash-dark .data-table{width:100%;border-collapse:collapse;font-size:13px}
.dash-dark .data-table th{background:#10346888;padding:8px 4px;text-align:left;border:1px solid #1b488077;color:#c6e2ff}
.dash-dark .data-table td{padding:7px 4px;border:1px solid #14335c66;color:#c6e2ff;background:#0a1f3e}
.dash-dark .data-table tr:nth-child(even){background:#0d2748}
.dash-dark .data-table tr:hover{background:#143660}
.dash-dark .chart-dom{width:100%;height:calc(100% - 10px);min-height:280px}
.dash-dark .stat-item-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.dash-dark .stat-item-box{background:#0e274d88;padding:10px;display:flex;align-items:center;gap:8px}
.dash-dark .stat-num{font-size:24px;color:#fff;font-weight:bold}
.dash-dark .dash-select{background:#0a2042;color:#c6e2ff;border:1px solid #255994;padding:2px 4px;font-size:13px}
.dash-dark .dash-btn{background:#103468;border:1px solid #266099;color:#fff;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:13px}
.dash-dark .dash-btn-alt{background:#081c38;border:1px solid #1c4475;color:#88aacc;padding:3px 6px;cursor:pointer;font-size:13px}
</style>

function getMonitorData(){var orders=scopedOrders();var groups={};orders.forEach(function(o){var key=role==='shiwei'?o.district:(role==='quxian'?o.school:o.grade);if(!groups[key]){groups[key]={name:key,textbooks:[],schools:{},grades:[],totalClasses:0,totalPeople:0,totalAmount:0,orderedPeople:0,orderedAmount:0,paidPeople:0,paidAmount:0,receivedPeople:0,receivedAmount:0};}var g=groups[key];if(g.textbooks.indexOf(o.textbook)<0)g.textbooks.push(o.textbook);g.schools[o.school]=true;if(g.grades.indexOf(o.grade)<0)g.grades.push(o.grade);var cm=(o.classes||'').match(/(\d+)个班/);if(cm){g.totalClasses+=parseInt(cm[1]);}else{cm=(o.classes||'').match(/(\d+)-(\d+)/);if(cm){g.totalClasses+=parseInt(cm[2])-parseInt(cm[1])+1;}}g.totalPeople+=o.count;g.totalAmount+=o.amount;g.orderedPeople+=o.ordered;g.orderedAmount+=o.free?0:o.ordered*o.price;g.paidPeople+=o.paid;g.paidAmount+=o.free?0:o.paid*o.price;var students=D.orderStudents.filter(function(s){return s.orderId===o.id});var received=students.filter(function(s){return s.received}).length;g.receivedPeople+=received;g.receivedAmount+=o.free?0:received*o.price;});var result=[];for(var k in groups){groups[k].schoolCount=Object.keys(groups[k].schools).length;result.push(groups[k]);}return result;}

People>0?Math.round(d.orderedPeople/d.totalPeople*100):0)+'%',d.paidPeople+'人<br>\u00a5'+d.paidAmount.toFixed(0)+'<br>'+(d.orderedPeople>0?Math.round(d.paidPeople/d.orderedPeople*100):0)+'%',d.receivedPeople+'人<br>\u00a5'+d.receivedAmount.toFixed(0)+'<br>'+(d.paidPeople>0?Math.round(d.receivedPeople/d.paidPeople*100):0)+'%']);return row;});html+='<div class="card"><div class="card-title">'+title+'</div>';html+=tbl(headers,rows);html+='</div>';return html;}

function renderFeedbackTable(){var kw=(document.getElementById('fb_keyword')?document.getElementById('fb_keyword').value:'').toLowerCase(),school=document.getElementById('fb_school')?document.getElementById('fb_school').value:'',type=document.getElementById('fb_type')?document.getElementById('fb_type').value:'',dateStart=document.getElementById('fb_date_start')?document.getElementById('fb_date_start').value:'',dateEnd=document.getElementById('fb_date_end')?document.getElementById('fb_date_end').value:'';var rows=scopedFeedbacks().filter(function(f){return(fbCurStatus==='全部'||f.status===fbCurStatus)&&(!kw||f.id.toLowerCase().indexOf(kw)>=0||f.reporter.toLowerCase().indexOf(kw)>=0)&&(!school||f.school===school)&&(!type||f.type===type)&&(!dateStart||f.date>=dateStart)&&(!dateEnd||f.date<=dateEnd)});return tbl(['反馈编号','反馈人','联系电话','所属学校','问题类型','提交时间','工单状态','操作'],rows.map(function(f){var ops='<button class="btn btn-outline btn-sm" onclick="showFeedbackDetail(\''+f.id+'\')">查看</button> ';if(f.status!=='已解决'&&f.status!=='无需处理'){ops+='<button class="btn btn-primary btn-sm" onclick="showFeedbackDetail(\''+f.id+'\')">处理</button>';}return[f.id,f.reporter,f.phone,f.school,f.type,f.date,badge(f.status),ops]}));}
function showFeedbackDetail(id){var f=D.feedbacks.find(function(x){return x.id===id});var html='<div class="modal-title">反馈详情 - '+f.id+'</div>';html+='<div class="detail-section"><div class="section-title">基本信息</div><div class="form-row"><div class="form-label">反馈编号</div><div class="form-input" style="border:none">'+f.id+'</div></div><div class="form-row"><div class="form-label">提交时间</div><div class="form-input" style="border:none">'+f.date+'</div></div><div class="form-row"><div class="form-label">问题类型</div><div class="form-input" style="border:none">'+f.type+'</div></div><div class="form-row"><div class="form-label">工单状态</div><div class="form-input" style="border:none">'+badge(f.status)+'</div></div></div>';html+='<div class="detail-section"><div class="section-title">家长信息</div><div class="form-row"><div class="form-label">反馈人</div><div class="form-input" style="border:none">'+f.reporter+'</div></div><div class="form-row"><div class="form-label">联系电话</div><div class="form-input" style="border:none">'+f.phone+'</div></div></div>';html+='<div class="detail-section"><div class="section-title">子女信息</div><div class="form-row"><div class="form-label">学生姓名</div><div class="form-input" style="border:none">'+f.studentName+'</div></div><div class="form-row"><div class="form-label">身份证号</div><div class="form-input" style="border:none">'+f.studentId+'</div></div><div class="form-row"><div class="form-label">就读学校</div><div class="form-input" style="border:none">'+f.school+'</div></div></div>';html+='<div class="detail-section"><div class="section-title">问题描述</div><div class="form-input" style="border:none;min-height:40px">'+f.content+'</div></div>';html+='<div class="detail-section"><div class="section-title">证明材料</div>';if(f.attachments&&f.attachments.length>0){f.attachments.forEach(function(a){html+='<div style="display:inline-block;margin:4px;padding:8px 12px;background:#f0f0f0;border-radius:4px;font-size:12px">'+a+'</div>';});}else{html+='<p class="text-grey">无附件</p>';}html+='</div>';html+='<div class="detail-section"><div class="section-title">处理记录</div>';if(f.timeline.length===0){html+='<p class="text-grey text-center" style="padding:12px">暂无处理记录</p>';}else{html+='<div class="timeline">';f.timeline.forEach(function(t){html+='<div class="timeline-item"><div class="t-time">'+t.time+'</div><div class="t-actor">'+t.actor+' - '+t.action+'</div><div class="t-note">'+t.note+'</div></div>';});html+='</div>';}html+='</div>';html+='<div class="detail-section"><div class="section-title">处理操作</div>';if(f.status==='已解决'||f.status==='无需处理'){html+='<p class="text-grey text-center" style="padding:8px">该工单已关闭</p>';}else{html+='<div class="form-row"><div class="form-label">处理状态</div><select class="form-select" id="fb_status"><option>处理中</option><option>已解决</option><option>无需处理</option></select></div><div class="form-row"><div class="form-label">处理回复</div><textarea class="form-input" id="fb_reply" rows="3" placeholder="请输入处理回复内容..."></textarea></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal(event)">关闭</button><button class="btn btn-primary" onclick="submitFeedback2(\''+f.id+'\')">提交处理</button></div>';}html+='</div>';showModal(html);}
function submitFeedback2(id){var f=D.feedbacks.find(function(x){return x.id===id});var status=document.getElementById('fb_status').value;var reply=document.getElementById('fb_reply').value;if(!reply){alert('请输入处理回复');return;}var now=new Date();var date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');f.status=status;f.timeline.push({time:date,actor:'管理员',action:'处理',note:reply});closeModal({target:{id:'modalOverlay'}});render();alert('处理成功！工单状态已更新为"'+status+'"，处理结果已同步反馈给诉求人。');}
function pageSatisfaction() {
  var html='<div class="sub-tabs"><div class="sub-tab active" onclick="subTab(event,\'sat_q\')">问卷管理</div><div class="sub-tab" onclick="subTab(event,\'sat_stat\')">满意度统计</div></div>';
  html+='<div class="sub-page active" id="sat_q"><div class="card"><div class="card-title">问卷管理<button class="btn btn-primary btn-sm" onclick="showQuestionnaireForm()">+ 新建问卷</button></div>';
  html+=tbl(['标题','范围','状态','回收量','目标量','进度','日期','操作'],D.questionnaires.map(function(q){var pct=Math.round(q.responses/q.target*100);return[q.title,q.scope,badge(q.status),q.responses,q.target,'<div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div>',q.date,'<button class="btn btn-outline btn-sm" onclick="showQDetail(\''+q.id+'\')">查看</button>']}));
  html+='</div></div>';
  html+='<div class="sub-page" id="sat_stat"><div class="notice-blue">满意度以书籍为维度统计，支持按教辅类型、科目、学段筛选查看。</div>';
  html+='<div class="card"><div class="card-title">满意度统计</div>';
  html+='<div class="filter-bar"><select class="form-select" id="sat_type" onchange="filterSat()"><option value="">全部类型</option><option>同步练习册</option><option>中考复习</option><option>寒暑假作业</option></select><select class="form-select" id="sat_subject" onchange="filterSat()"><option value="">全部科目</option><option>语文</option><option>数学</option><option>英语</option><option>综合</option></select><select class="form-select" id="sat_stage" onchange="filterSat()"><option value="">全部学段</option><option>小学</option><option>初中</option></select></div>';
  html+='<div id="satTable">'+renderSatTable()+'</div>';
  html+='</div>';
  html+='<div class="card"><div class="card-title">满意度排行榜</div>';
  html+='<div class="filter-bar"><select class="form-select" id="rank_type" onchange="filterSatRanking()"><option value="">全部类型</option><option>同步练习册</option><option>中考复习</option><option>寒暑假作业</option></select><div class="flex gap8"><button class="btn btn-sm btn-primary" id="rank_desc" onclick="toggleRankOrder(\'desc\')">倒序</button><button class="btn btn-sm btn-outline" id="rank_asc" onclick="toggleRankOrder(\'asc\')">正序</button></div><span style="font-size:13px;color:#999">展示前10</span></div>';
  html+='<div id="satRanking">'+renderSatRanking()+'</div>';
  html+='</div></div>';
  return html;
}
function showQuestionnaireForm(){showModal('<div class="modal-title">新建满意度问卷</div><div class="form-row"><div class="form-label">问卷标题</div><input class="form-input" placeholder="如：2026秋季教辅满意度调查"></div><div class="form-row"><div class="form-label">调查范围</div><select class="form-select"><option>全市</option><option>XX区</option><option>XX区</option></select></div><div class="form-row"><div class="form-label">目标量</div><input class="form-input" type="number" value="1000"></div><div class="form-row"><div class="form-label">题目设置</div><textarea class="form-input" rows="4" placeholder="每行一道题">教辅内容质量评分\n教辅印刷质量评分\n教辅价格合理性评分\n整体满意度评分</textarea></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal(event)">取消</button><button class="btn btn-primary" onclick="closeModal(event);alert(\'问卷已创建并发放\')">发布问卷</button></div>');}
function showQDetail(id){var q=D.questionnaires.find(function(x){return x.id==id});showModal('<div class="modal-title">'+q.title+'</div><div class="form-row"><div class="form-label">范围</div><div class="form-input" style="border:none">'+q.scope+'</div></div><div class="form-row"><div class="form-label">状态</div><div class="form-input" style="border:none">'+badge(q.status)+'</div></div><div class="form-row"><div class="form-label">回收/目标</div><div class="form-input" style="border:none">'+q.responses+' / '+q.target+'</div></div><div class="card-title" style="margin-top:12px">问卷题目</div><ol style="padding-left:20px;line-height:2">'+q.questions.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ol><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal(event)">关闭</button></div>');}
function getSatFilter(){var t=document.getElementById('sat_type')?document.getElementById('sat_type').value:'',s=document.getElementById('sat_subject')?document.getElementById('sat_subject').value:'',st=document.getElementById('sat_stage')?document.getElementById('sat_stage').value:'';return{t:t,s:s,st:st};}
function filterSatData(){var f=getSatFilter();return scopedSatisfaction().filter(function(x){return(!f.t||x.type===f.t)&&(!f.s||x.subject===f.s)&&(!f.st||x.stage===f.st)});}
function renderSatTable(){var rows=filterSatData();return tbl(['教辅书籍','类型','科目','学段','平均评分','参评人数','应参评人数','参评率','覆盖学校数'],rows.map(function(s){var pct=Math.round(s.count/s.total*100);return[s.textbook,s.type,s.subject,s.stage,'<span class="text-green fw700">'+s.score+'</span> / 5',s.count,s.total,pct+'%',s.schools+'所']}));}
function renderSatRanking(){var t=document.getElementById('rank_type')?document.getElementById('rank_type').value:'';var rows=scopedSatisfaction().filter(function(x){return!t||x.type===t}).slice().sort(function(a,b){return rankOrder==='desc'?b.score-a.score:a.score-b.score}).slice(0,10);if(!rows.length)return'<div style="text-align:center;color:#999;padding:20px">暂无数据</div>';var h='';var medals=['&#129351;','&#129352;','&#129353;'];rows.forEach(function(s,i){var pct=Math.round(s.score/5*100);var rk=i<3?medals[i]:'<span style="color:#999">'+(i+1)+'</span>';h+='<div class="bar-row"><div class="bar-label" style="width:32px;text-align:center;font-size:18px">'+rk+'</div><div class="bar-label" style="width:180px">'+s.textbook+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--green)">'+s.score+'/5</div></div></div>';});return h;}
function toggleRankOrder(o){rankOrder=o;document.getElementById('rank_desc').className='btn btn-sm '+(o==='desc'?'btn-primary':'btn-outline');document.getElementById('rank_asc').className='btn btn-sm '+(o==='asc'?'btn-primary':'btn-outline');document.getElementById('satRanking').innerHTML=renderSatRanking();}
function filterSatRanking(){document.getElementById('satRanking').innerHTML=renderSatRanking();}
function filterSat(){document.getElementById('satTable').innerHTML=renderSatTable();filterSatRanking();}

render();
</script>
